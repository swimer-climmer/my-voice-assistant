
<!DOCTYPE html>
<html>
<head>
    <title>My Voice Assistant</title>

    <style>
        body {
            background: #101827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #54d6ff;
            font-size: 36px;
        }

        button {
            background: #168cff;
            color: white;
            border: none;
            padding: 18px 30px;
            border-radius: 15px;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #0066cc;
        }

        #output {
            font-size: 22px;
            margin-top: 30px;
            line-height: 1.6;
            white-space: pre-line;
        }
    </style>
</head>

<body>

    <h1>🎤 My Voice Assistant</h1>

    <p>Click the button and talk to me!</p>

    <button id="listen">🎤 Start Listening</button>

    <div id="output">Waiting for your voice...</div>

    <script>

        const listenButton = document.getElementById("listen");
        const output = document.getElementById("output");

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        if (!SpeechRecognition) {

            output.textContent =
                "Sorry! Your browser does not support speech recognition.";

        } else {

            const recognition = new SpeechRecognition();

            recognition.lang = "en-US";
            recognition.continuous = false;
            recognition.interimResults = false;

            listenButton.onclick = function() {

                output.textContent = "Listening... 🎧";

                recognition.start();

            };

            recognition.onresult = function(event) {

                const words = event.results[0][0].transcript;

                output.textContent = "You said: " + words;

                const message = words.toLowerCase();

                let answer = "";

                // ASSISTANT BRAIN

                if (message.includes("hello") || message.includes("hi")) {

                    answer = "Hello! It's nice to talk to you!";

                }

                else if (message.includes("your name")) {

                    answer = "I'm your new voice assistant!";

                }

                else if (message.includes("how are you")) {

                    answer = "I'm doing great! How are you?";

                }

                else if (message.includes("what time")) {

                    answer = "I don't have a clock yet!";

                }

                else if (message.includes("what is your favorite color")) {

                    answer = "My favorite color is blue!";

                }

                else if (message.includes("bye")) {

                    answer = "Goodbye! Talk to you later!";

                }

                else {

                    answer = "That's interesting! Tell me more.";

                }

                output.textContent += "\nAssistant: " + answer;

                // SPEAK THE ANSWER

                const speech = new SpeechSynthesisUtterance(answer);

                speech.lang = "en-US";

                window.speechSynthesis.speak(speech);

            };

            recognition.onerror = function(event) {

                output.textContent = "Error: " + event.error;

            };

            recognition.onend = function() {

                listenButton.textContent = "🎤 Start Listening";

            };

        }

    </script>

</body>
</html>
