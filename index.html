
<!DOCTYPE html>
<html>
<head>
    <title>My Voice Assistant</title>

    <style>
        body {
            background: #101827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #54d6ff;
            font-size: 36px;
        }

        button, select {
            padding: 14px 22px;
            border-radius: 12px;
            font-size: 18px;
            margin: 8px;
        }

        button {
            background: #168cff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0066cc;
        }

        select {
            background: white;
            color: #101827;
        }

        #output {
            font-size: 21px;
            margin-top: 30px;
            line-height: 1.7;
            white-space: pre-line;
        }
    </style>
</head>

<body>

    <h1>🎤 My Voice Assistant</h1>

    <p>Click the button and talk to me!</p>

    <button id="listen">🎤 Start Talking</button>
    <button id="stop">⏹ Stop</button>

    <br><br>

    <label for="voiceSelect">Choose my voice:</label>

    <select id="voiceSelect"></select>

    <div id="output">Waiting for your voice...</div>

    <script>

        // ELEMENTS

        const listenButton = document.getElementById("listen");
        const stopButton = document.getElementById("stop");
        const output = document.getElementById("output");
        const voiceSelect = document.getElementById("voiceSelect");

        // MEMORY

        let userName = "";

        // LISTENING SETTINGS

        let listening = false;
        let speaking = false;

        // VOICES

        let availableVoices = [];

        function loadVoices() {

            availableVoices = window.speechSynthesis.getVoices();

            voiceSelect.innerHTML = "";

            availableVoices.forEach((voice, index) => {

                const option = document.createElement("option");

                option.value = index;

                option.textContent =
                    voice.name + " (" + voice.lang + ")";

                voiceSelect.appendChild(option);

            });

        }

        window.speechSynthesis.onvoiceschanged = loadVoices;

        loadVoices();

        // SPEAKING

        function speak(answer) {

            speaking = true;

            const speech = new SpeechSynthesisUtterance(answer);

            const selectedVoice =
                availableVoices[voiceSelect.value];

            if (selectedVoice) {
                speech.voice = selectedVoice;
            }

            speech.lang = "en-US";

            speech.onend = function() {

                speaking = false;

                if (listening) {
                    setTimeout(startListening, 500);
                }

            };

            speech.onerror = function() {

                speaking = false;

                if (listening) {
                    setTimeout(startListening, 500);
                }

            };

            window.speechSynthesis.speak(speech);

        }

        // ASSISTANT BRAIN

        function getAnswer(words) {

            const message = words.toLowerCase().trim();

            // REMEMBER NAME

            if (message.includes("my name is")) {

                userName = words.substring(
                    message.indexOf("my name is") + 10
                ).trim();

                return "Nice to meet you, " + userName + "!";

            }

            else if (
                message.includes("what is my name") ||
                message.includes("what's my name")
            ) {

                if (userName !== "") {
                    return "Your name is " + userName + "!";
                }

                return "I don't know your name yet!";

            }

            // MATH

            const mathMatch = message.match(
                /(-?\d+(?:\.\d+)?)\s*(plus|minus|times|multiplied by|divided by)\s*(-?\d+(?:\.\d+)?)/
            );

            if (mathMatch) {

                const a = Number(mathMatch[1]);

                const operation = mathMatch[2];

                const b = Number(mathMatch[3]);

                if (operation === "plus") {
                    return "The answer is " + (a + b);
                }

                if (operation === "minus") {
                    return "The answer is " + (a - b);
                }

                if (
                    operation === "times" ||
                    operation === "multiplied by"
                ) {
                    return "The answer is " + (a * b);
                }

                if (operation === "divided by") {

                    if (b === 0) {
                        return "You cannot divide by zero!";
                    }

                    return "The answer is " + (a / b);

                }

            }

            // CONVERSATION

            if (
                message.includes("hello") ||
                message.includes("hi")
            ) {

                return "Hello " + (userName || "friend") + "!";

            }

            if (message.includes("your name")) {

                return "I'm your new voice assistant!";

            }

            if (message.includes("how are you")) {

                return "I'm doing great! How are you?";

            }

            if (message.includes("what time")) {

                return "I don't have a clock yet!";

            }

            if (message.includes("favorite color")) {

                return "My favorite color is blue!";

            }

            if (message.includes("bye")) {

                listening = false;

                return "Goodbye! Talk to you later!";

            }

            return "I don't know that one yet, but I'm learning!";

        }

        // SPEECH RECOGNITION

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        let recognition = null;

        if (!SpeechRecognition) {

            output.textContent =
                "Speech recognition is not supported in this browser.";

            listenButton.disabled = true;

        } else {

            recognition = new SpeechRecognition();

            recognition.lang = "en-US";

            recognition.continuous = false;

            recognition.interimResults = false;

            // START LISTENING

            function startListening() {

                if (!listening || speaking) return;

                try {

                    recognition.start();

                } catch (error) {

                    console.log("Recognition is already starting.");

                }

            }

            listenButton.onclick = function() {

                listening = true;

                output.textContent = "Listening... 🎧";

                startListening();

            };

            // STOP LISTENING

            stopButton.onclick = function() {

                listening = false;

                speaking = false;

                recognition.stop();

                window.speechSynthesis.cancel();

                output.textContent = "Conversation stopped.";

            };

            // WHEN WORDS ARE RECOGNIZED

            recognition.onresult = function(event) {

                const words =
                    event.results[0][0].transcript;

                output.textContent = "You said: " + words;

                const answer = getAnswer(words);

                output.textContent +=
                    "\nAssistant: " + answer;

                speak(answer);

            };

            // MICROPHONE ERRORS

            recognition.onerror = function(event) {

                output.textContent =
                    "Microphone error: " + event.error;

                console.log(
                    "Speech recognition error:",
                    event.error
                );

                if (
                    event.error === "not-allowed" ||
                    event.error === "service-not-allowed"
                ) {
                    listening = false;
                }

            };

            // WHEN LISTENING ENDS

            recognition.onend = function() {

                if (listening && !speaking) {

                    output.textContent =
                        "I stopped hearing you. Trying again...";

                    setTimeout(startListening, 1000);

                }

            };

        }

    </script>

</body>
</html>
