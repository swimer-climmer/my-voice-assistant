
<!DOCTYPE html>
<html>
<head>
    <title>My Voice Assistant</title>

    <style>
        body {
            background: #101827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #54d6ff;
            font-size: 36px;
        }

        button {
            background: #168cff;
            color: white;
            border: none;
            padding: 18px 30px;
            border-radius: 15px;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #0066cc;
        }

        #output {
            font-size: 22px;
            margin-top: 30px;
            line-height: 1.6;
            white-space: pre-line;
        }
    </style>
</head>

<body>

    <h1>🎤 My Voice Assistant</h1>

    <p>Click the button and talk to me!</p>

    <button id="listen">🎤 Start Talking</button>
<button id="stop">⏹ Stop</button>

    <br><br>

<label for="voiceSelect">Choose my voice:</label>

<select id="voiceSelect">
</select>
    
    <div id="output">Waiting for your voice...</div>

    <script>
        let userName = "";
const listenButton = document.getElementById("listen");
const stopButton = document.getElementById("stop");
const output = document.getElementById("output");
        
const voiceSelect = document.getElementById("voiceSelect");

let availableVoices = [];

function loadVoices() {
    availableVoices = window.speechSynthesis.getVoices();

    voiceSelect.innerHTML = "";

    availableVoices.forEach((voice, index) => {
        const option = document.createElement("option");

        option.value = index;
        option.textContent = voice.name + " (" + voice.lang + ")";

        voiceSelect.appendChild(option);
    });
}

window.speechSynthesis.onvoiceschanged = loadVoices;

loadVoices();


const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let listening = false;
let recognition;
let speaking = false;

if (!SpeechRecognition) {
    output.textContent = "Your browser does not support speech recognition.";
} else {

    recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;

    function startListening() {
        if (!listening || speaking) return;

        try {
            recognition.start();
        } catch (error) {
            console.log("Already listening");
        }
    }

    listenButton.onclick = function() {
        listening = true;
        output.textContent = "I'm listening! 🎧";
        startListening();
    };

    stopButton.onclick = function() {
        listening = false;
        recognition.stop();
        window.speechSynthesis.cancel();
        output.textContent = "Conversation stopped.";
    };

    recognition.onresult = function(event) {

        const words = event.results[0][0].transcript;
        output.textContent = "You said: " + words;

        const message = words.toLowerCase();

        let answer = "";
        //assistent brain
        

if (message.includes("my name is")) {

    userName = words.substring(
        message.indexOf("my name is") + 10
    ).trim();

    answer = "Nice to meet you, " + userName + "! I'll remember your name.";

}

else if (message.includes("what is my name") ||
         message.includes("what's my name")) {

    if (userName !== "") {
        answer = "Your name is " + userName + "!";
    } else {
        answer = "I don't know your name yet. What should I call you?";
    }

}



        if (message.includes("hello") || message.includes("hi")) {
            answer = "Hello! It's nice to talk to you!";
        }
        else if (message.includes("your name")) {
            answer = "I'm your new voice assistant!";
        }
        else if (message.includes("how are you")) {
            answer = "I'm doing great! How are you?";
        }
        else if (message.includes("what time")) {
            answer = "I don't have a clock yet!";
        }
        else if (message.includes("favorite color")) {
            answer = "My favorite color is blue!";
        }
        else if (message.includes("bye")) {
            answer = "Goodbye! Talk to you later!";
            listening = false;
        }
        else {
            answer = "That's interesting! Tell me more.";
        }

        output.textContent += "\nAssistant: " + answer;

        speaking = true;

        const speech = new SpeechSynthesisUtterance(answer);

const selectedVoice = availableVoices[voiceSelect.value];

if (selectedVoice) {
    speech.voice = selectedVoice;
}

        speech.lang = "en-US";

        speech.onend = function() {
            speaking = false;

            if (listening) {
                setTimeout(startListening, 300);
            }
        };

        speech.onerror = function() {
            speaking = false;

            if (listening) {
                setTimeout(startListening, 300);
            }
        };

        window.speechSynthesis.speak(speech);
    };

    recognition.onerror = function(event) {
        console.log("Recognition error:", event.error);

        if (event.error === "not-allowed") {
            listening = false;
            output.textContent = "Please allow microphone access.";
        }
    };

    recognition.onend = function() {
        if (listening && !speaking) {
            setTimeout(startListening, 300);
        }
    };
}
</script>
</body>
</html>
